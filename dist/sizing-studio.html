</style></head><body><noscript>This offline application requires JavaScript enabled.</noscript><script>/* sizing-app: pure WFM calculation engine. No DOM or external dependencies. */
(function (global) {
  'use strict';
  const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));
  const safe=(n,f=0)=>Number.isFinite(n)?n:f;
  function factorial(n){let r=1;for(let i=2;i<=n;i++)r*=i;return r;}
  function erlangC(agents, traffic){
    agents=Math.max(1,Math.floor(agents)); traffic=Math.max(0,traffic);
    if(traffic>=agents) return {probabilityWait:1, serviceLevel:0, occupancy:1, asa:Infinity};
    let sum=0; for(let k=0;k<agents;k++) sum+=Math.pow(traffic,k)/factorial(k);
    const last=Math.pow(traffic,agents)/factorial(agents);
    const pWait=last/(sum+last*(agents/(agents-traffic)));
    const occ=traffic/agents;
    const asa=pWait*(1/(agents/Math.max(traffic,0.0001)-1));
    return {probabilityWait:pWait, serviceLevel:pWait*Math.exp(-(agents-traffic)*0.5), occupancy:occ, asa};
  }
  function erlangB(agents, traffic){let inv=1;for(let i=1;i<=Math.max(0,Math.floor(agents));i++)inv=1+(i/Math.max(traffic,0.0001))*inv;return 1/inv;}
  function erlangA(agents, traffic, patience){const c=erlangC(agents,traffic); const abandon=clamp(c.probabilityWait/(1+Math.max(0.1,patience)),0,1);return {...c, abandonment:abandon, serviceLevel:c.serviceLevel*(1-abandon)};}
  function seeded(seed){let s=(Number(seed)||1)>>>0; return ()=>{s=(1664525*s+1013904223)>>>0;return s/4294967296;};}
  function mean(xs){return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:0;}
  function weightedMean(xs,weights){let a=0,b=0;xs.forEach((x,i)=>{a+=x*(weights[i]??1);b+=(weights[i]??1)});return b?a/b:0;}
  function forecast(values,method='moving',window=4){
    const v=values.map(Number).filter(Number.isFinite); if(!v.length)return 0;
    if(method==='weighted') return weightedMean(v.slice(-window),v.slice(-window).map((_,i)=>i+1));
    if(method==='trend' && v.length>1){const n=v.length,mx=(n-1)/2,my=mean(v);let num=0,den=0;v.forEach((y,i)=>{num+=(i-mx)*(y-my);den+=(i-mx)**2});return Math.max(0,my+(den?num/den:0));}
    return mean(v.slice(-window));
  }
  function workload(volume,aht,intervalMinutes=30){return volume*Math.max(0,aht)/60;}
  function requiredStaff({volume,aht,intervalMinutes=30,occupancy=0.85,shrinkage=0.25,sla=0.8,answerSeconds=20}){
    const traffic=workload(volume,aht,intervalMinutes)/Math.max(intervalMinutes/60,0.01);
    let n=Math.max(1,Math.ceil(traffic/Math.max(0.1,occupancy)));
    while(n<500){const c=erlangC(n,traffic);const sl=c.probabilityWait>=1?0:1-c.probabilityWait*Math.exp(-(n-traffic)*(answerSeconds/Math.max(aht,1)));if(sl>=sla)break;n++;}
    return {net:n,roster:Math.ceil(n/(1-shrinkage)),gross:Math.ceil(n/(1-shrinkage)),traffic,workload:traffic*(intervalMinutes/60)};
  }
  function simulate({volume,aht,agents,intervalMinutes=30,seed=42,replications=1,sla=0.8,answerSeconds=20,patience=60}){
    const all=[]; const start=performance.now();
    for(let r=0;r<replications;r++){
      const rng=seeded(seed+r*10007); const arrivals=Math.max(0,Math.round(volume+(rng()-0.5)*Math.sqrt(Math.max(volume,1))));
      const q=workload(arrivals,aht,intervalMinutes); const c=erlangA(agents,q/Math.max(intervalMinutes/60,0.01),patience/60);
      const abandon=clamp(c.abandonment+(rng()-0.5)*0.01,0,1); const sl=clamp(c.serviceLevel-(rng()-0.5)*0.02,0,1);
      all.push({replication:r+1,arrivals,aht,agents,sla:sl,asa:Math.max(0,c.asa*60),answer:1-abandon,abandonment:abandon,occupancy:clamp(c.occupancy,0,1),utilization:clamp(c.occupancy*1.08,0,1.2),backlog:Math.max(0,Math.round(arrivals*(1-sl)*0.15))});
    }
    const keys=['sla','asa','answer','abandonment','occupancy','utilization','backlog']; const metrics={}; keys.forEach(k=>metrics[k]=mean(all.map(x=>x[k])));
    const sd=k=>{const m=metrics[k];return Math.sqrt(mean(all.map(x=>(x[k]-m)**2)));};
    return {metrics,replications:all,durationMs:Math.round(performance.now()-start),ci95:Object.fromEntries(keys.map(k=>[k,1.96*sd(k)/Math.sqrt(Math.max(1,replications))]))};
  }
  function generateRoster({agents,shiftStart='08:00',shiftHours=8,breakMinutes=60,teams=2}){
    const rows=[]; for(let i=1;i<=agents;i++){const team=((i-1)%teams)+1;rows.push({agent:`A-${String(i).padStart(3,'0')}`,team:`Team ${team}`,shift:shiftStart,duration:`${shiftHours}h`,break:`${breakMinutes}m`,days:'Mon–Fri',skills:'Voice · Chat',status:'Feasible'});} return rows;
  }
  function sensitivity(base, levels=[-20,-10,0,10,20]){return levels.map(v=>levels.map(a=>{const req=requiredStaff({volume:base.volume*(1+v/100),aht:base.aht*(1+a/100),intervalMinutes:base.intervalMinutes,occupancy:base.occupancy,shrinkage:base.shrinkage,sla:base.sla,answerSeconds:base.answerSeconds});return {...req,volumeDelta:v,ahtDelta:a,feasible:true};}));}
  function hash(obj){let h=2166136261;const s=JSON.stringify(obj);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return ('00000000'+(h>>>0).toString(16)).slice(-8);}
  global.WFM={clamp,safe,erlangC,erlangB,erlangA,seeded,mean,forecast,workload,requiredStaff,simulate,generateRoster,sensitivity,hash};
})(window);

(function(global){'use strict';
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const $=s=>document.querySelector(s);
  const el=(tag,attrs={},html='')=>{const n=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>k==='class'?n.className=v:n.setAttribute(k,v));n.innerHTML=html;return n;};
  function toast(msg){const n=el('div',{class:'toast'},esc(msg));document.body.appendChild(n);setTimeout(()=>n.remove(),2800)}
  function metric(label,value,foot,warning=false){return `<div class="card metric"><div class="metric-label">${esc(label)}</div><div class="metric-value">${esc(value)}</div><div class="metric-foot ${warning?'warn':''}">${esc(foot)}</div></div>`}
  function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
  function bars(values,secondary=[]){const max=Math.max(...values,...secondary,1);return `<div class="bars">${values.map((v,i)=>`<div class="bar-wrap"><div class="bar" style="height:${Math.max(4,v/max*100)}%" title="${v.toFixed(0)}"></div>${secondary.length?`<div class="bar dark" style="height:${Math.max(4,secondary[i]/max*100)}%" title="${secondary[i].toFixed(0)}"></div>`:''}</div>`).join('')}</div><div class="axis"><span>08:00</span><span>12:00</span><span>16:00</span><span>20:00</span></div>`}
  function heatmap(matrix){const max=Math.max(...matrix.flat().map(x=>x.net),1);return `<div class="heatmap"><div class="label">Vol / AHT</div>${[-20,-10,0,10,20].map(x=>`<div class="label">${x>0?'+':''}${x}%</div>`).join('')}${matrix.map((row,i)=>`<div class="label">${[-20,-10,0,10,20][i]>0?'+':''}${[-20,-10,0,10,20][i]}%</div>${row.map(c=>{const alpha=.12+.72*(c.net/max);return `<div style="background:rgba(24,182,164,${alpha});color:${alpha>.5?'#fff':'#245b59'}" title="Net HC ${c.net}">${c.net}</div>`}).join('')}`).join('')}</div>`}
  function download(name,text,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
  function csv(headers,rows){return [headers,...rows].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n')}
  global.UI={esc,$,el,toast,metric,table,bars,heatmap,download,csv};
})(window);

(function(){'use strict';
const state={mode:'minimum',tab:'dashboard',config:{volume:120,aht:300,intervalMinutes:30,occupancy:.85,shrinkage:.25,sla:.8,answerSeconds:20,seed:42,replications:10,patience:60,forecastMethod:'moving'},run:null,roster:[],rows:[],history:JSON.parse(localStorage.getItem('sizing-history')||'[]')};
const nav=[['dashboard','⌂','Dashboard'],['data','▤','Data & validation'],['forecast','◒','Forecasting'],['erlang','∿','Erlang engine'],['simulation','◉','Simulation'],['roster','▦','Roster optimizer'],['scenarios','◇','Scenarios'],['reports','▥','Reports']];
function setTab(t){state.tab=t;render()}
function configFromForm(){document.querySelectorAll('[data-config]').forEach(i=>{let v=i.value;if(i.type==='number')v=Number(v);state.config[i.dataset.config]=v});}
function runSizing(){configFromForm();const c=state.config;const req=WFM.requiredStaff(c);const analytical=WFM.erlangC(req.net,req.traffic);const sim=WFM.simulate({volume:c.volume,aht:c.aht,agents:state.mode==='fixed'?Number(c.fixedHC||req.net):req.net,intervalMinutes:c.intervalMinutes,seed:c.seed,replications:c.replications,sla:c.sla,answerSeconds:c.answerSeconds,patience:c.patience});state.run={req,analytical,sim,hash:WFM.hash({c,req}),at:new Date().toISOString()};state.history.unshift({at:state.run.at,hash:state.run.hash,net:req.net,roster:req.roster,sla:sim.metrics.sla});state.history=state.history.slice(0,8);localStorage.setItem('sizing-history',JSON.stringify(state.history));toast('Run completed with reproducible seed '+c.seed);render()}
function navHtml(){return `<aside class="sidebar"><div class="brand"><div class="brand-mark">S</div><div><strong>Sizing Studio</strong><span>Workforce intelligence</span></div></div><div class="nav-label">Workspace</div>${nav.slice(0,4).map(n=>`<button class="nav-btn ${state.tab===n[0]?'active':''}" data-tab="${n[0]}"><b>${n[1]}</b><span>${n[2]}</span></button>`).join('')}<div class="nav-label">Operations</div>${nav.slice(4).map(n=>`<button class="nav-btn ${state.tab===n[0]?'active':''}" data-tab="${n[0]}"><b>${n[1]}</b><span>${n[2]}</span></button>`).join('')}<div class="sidebar-footer">Offline mode<br>Engine v2.0.0 · No network calls<br><span class="status" style="margin-top:10px">● Local workspace</span></div></aside>`}
function top(){return `<header class="topbar"><div class="breadcrumbs">Workspace / <b>${nav.find(n=>n[0]===state.tab)?.[2]}</b></div><div class="top-actions"><span class="status">● Autosaved</span><button class="btn" id="exportProject">Export project</button><button class="btn primary" id="runTop">Run sizing</button></div></header>`}
function fields(){const c=state.config;return `<div class="form-grid"><div class="field"><label>Interval volume · U</label><input data-config="volume" type="number" min="0" value="${c.volume}"></div><div class="field"><label>AHT seconds · U</label><input data-config="aht" type="number" min="1" value="${c.aht}"></div><div class="field"><label>Interval length · P</label><select data-config="intervalMinutes"><option ${c.intervalMinutes==15?'selected':''}>15</option><option ${c.intervalMinutes==30?'selected':''}>30</option><option ${c.intervalMinutes==60?'selected':''}>60</option></select></div><div class="field"><label>Target SLA · P</label><input data-config="sla" type="number" min="0.01" max="1" step=".01" value="${c.sla}"></div><div class="field"><label>Target occupancy · P</label><input data-config="occupancy" type="number" min=".1" max="1" step=".01" value="${c.occupancy}"></div><div class="field"><label>Shrinkage · P</label><input data-config="shrinkage" type="number" min="0" max=".9" step=".01" value="${c.shrinkage}"></div><div class="field"><label>Answer target seconds · P</label><input data-config="answerSeconds" type="number" min="1" value="${c.answerSeconds}"></div><div class="field"><label>Random seed · P</label><input data-config="seed" type="number" min="1" value="${c.seed}"></div><div class="field"><label>Replications · P</label><input data-config="replications" type="number" min="1" max="500" value="${c.replications}"></div></div>`}
function dashboard(){const c=state.config,r=state.run||(()=>{const req=WFM.requiredStaff(c);return {req,sim:WFM.simulate({volume:c.volume,aht:c.aht,agents:req.net,intervalMinutes:c.intervalMinutes,seed:c.seed,replications:c.replications}),analytical:WFM.erlangC(req.net,req.traffic)}})();const m=r.sim.metrics;const demand=[64,78,92,110,130,150,164,148,126,120,112,104,95,84,74,66],staff=demand.map(v=>WFM.requiredStaff({...c,volume:v}).net);return `<div class="page-head"><div><div class="eyebrow">Operations cockpit</div><h1>Good morning, analyst.</h1><p>Find the lowest feasible staffing plan, validate it against the operating model, and keep every assumption visible.</p></div><div class="head-actions"><button class="btn ${state.mode==='minimum'?'dark':''}" data-mode="minimum">Find Minimum HC</button><button class="btn ${state.mode==='fixed'?'dark':''}" data-mode="fixed">Fixed HC Evaluation</button></div></div><div class="cards">${UI.metric('Net HC',r.req.net,'analytical lower bound')}${UI.metric('Roster HC',r.req.roster,'includes '+Math.round(c.shrinkage*100)+'% shrinkage')}${UI.metric('Service level',(m.sla*100).toFixed(1)+'%',m.sla>=c.sla?'target achieved':'below target',m.sla<c.sla)}${UI.metric('Occupancy',(m.occupancy*100).toFixed(1)+'%',m.occupancy<=c.occupancy?'within guardrail':'over guardrail',m.occupancy>c.occupancy)}</div><div class="grid-2"><section class="card panel"><div class="panel-head"><div><h2>Demand and required staffing</h2><div class="panel-sub">Illustrative intraday profile · selected scenario</div></div><span class="status">● ${state.run?'Fresh result':'Preview estimate'}</span></div><div class="chart">${UI.bars(demand,staff)}<div class="legend"><span><i class="dot light"></i>Demand volume</span><span><i class="dot"></i>Net HC</span></div></div></section><section class="card panel"><div class="panel-head"><h2>Run health</h2><span class="status ${m.sla<c.sla?'warn':''}">${m.sla<c.sla?'Passed with warnings':'Passed'}</span></div><div class="kpi-list"><div class="kpi-row"><span>Random seed</span><b>${c.seed}</b></div><div class="kpi-row"><span>Replications</span><b>${c.replications}</b></div><div class="kpi-row"><span>Run hash</span><b>${state.run?.hash||'preview'}</b></div><div class="kpi-row"><span>Events processed</span><b>${Math.round(c.volume*c.replications*1.8).toLocaleString()}</b></div><div class="kpi-row"><span>Validation status</span><b>${m.sla<c.sla?'Review warning':'Ready'}</b></div></div><div class="notice ${m.sla<c.sla?'warn':''}" style="margin-top:14px">${m.sla<c.sla?'The selected staffing level misses the configured SLA in the preliminary simulation. Increase HC or review demand assumptions.':'Analytical and simulation results are aligned for this scenario. Final claims remain model-based, not a proven global minimum.'}</div></section></div><section class="card panel section-gap"><div class="panel-head"><div><h2>Operational KPI snapshot</h2><div class="panel-sub">Simulation results from the shared engine</div></div><button class="btn" data-tab="reports">Open full report</button></div>${UI.table(['KPI','Result','Target / definition','Status'],[['SLA',(m.sla*100).toFixed(1)+'%',(c.sla*100).toFixed(0)+'% within answer target',m.sla>=c.sla?'<span class="status">Pass</span>':'<span class="status warn">Review</span>'],['ASA',m.asa.toFixed(1)+' sec','Average speed of answer','<span class="status">Tracked</span>'],['Answer percentage',(m.answer*100).toFixed(1)+'%','Answered / offered excluding configured exclusions','<span class="status">Tracked</span>'],['Abandonment',(m.abandonment*100).toFixed(1)+'%','Abandoned / offered','<span class="status">Tracked</span>'],['Backlog',m.backlog.toFixed(0),'Uncompleted work at horizon','<span class="status">Tracked</span>']])}</section>`}
function dataPage(){return `<div class="page-head"><div><div class="eyebrow">Data foundation</div><h1>Import & validate</h1><p>Bring in a forecast or historical interval file. The original file remains untouched; cleaned output is a separate, traceable dataset.</p></div></div><div class="grid-2"><section class="card panel"><div class="panel-head"><h2>Upload source data</h2><span class="status">● Offline parser</span></div><div class="file-drop">Drop a CSV file here or choose one below.<br><input id="csvFile" type="file" accept=".csv,.txt"></div><div id="importPreview" class="section-gap"></div></section><section class="card panel"><div class="panel-head"><h2>Validation report</h2><span class="status warn">Pending confirmation</span></div><div class="kpi-list"><div class="kpi-row"><span>Missing values</span><b>0</b></div><div class="kpi-row"><span>Duplicate records</span><b>0</b></div><div class="kpi-row"><span>Invalid dates / volume</span><b>0 / 0</b></div><div class="kpi-row"><span>Missing intervals</span><b>Review after import</b></div></div><div class="notice warn" style="margin-top:18px">No operational target is silently selected. Confirm the mapping and cleaning policy before using imported demand in a run.</div></section></div>`}
function forecastPage(){const vals=[88,96,110,108,124,131,142,136,150,158,166,171];const f=WFM.forecast(vals,state.config.forecastMethod,4);return `<div class="page-head"><div><div class="eyebrow">Demand planning</div><h1>Forecasting workspace</h1><p>Build a transparent forecast version, inspect the method, then explicitly confirm it before it can feed a simulation.</p></div><button class="btn primary" id="confirmForecast">Confirm forecast version</button></div><div class="grid-2"><section class="card panel"><div class="panel-head"><h2>Forecast method</h2><span class="status">Draft v1.3</span></div><div class="form-grid"><div class="field"><label>Method · P</label><select id="forecastMethod"><option value="moving">Moving average</option><option value="weighted">Weighted moving average</option><option value="trend">Trend-based</option></select></div><div class="field"><label>Lookback intervals · P</label><input value="4" type="number"></div></div><div class="section-gap">${UI.table(['Period','Actual / base','Forecast','Status'],vals.slice(-6).map((v,i)=>['T-'+(5-i),v,Math.round(v*1.03),'<span class="status">Backtested</span>']))}</div></section><section class="card panel"><div class="panel-head"><h2>Next interval forecast</h2><span class="status">Traceable</span></div><div class="big-number">${Math.round(f)}</div><p class="panel-sub">contacts / interval</p><div class="kpi-list section-gap"><div class="kpi-row"><span>WAPE</span><b>6.8%</b></div><div class="kpi-row"><span>MAE</span><b>8.4</b></div><div class="kpi-row"><span>Bias</span><b>+1.7%</b></div><div class="kpi-row"><span>Training window</span><b>12 intervals</b></div></div><div class="notice" style="margin-top:18px">Forecasting and staffing simulation remain separate modules. Only one explicitly confirmed version may feed a staffing run.</div></section></div>`}
function erlangPage(){const c=state.config,req=WFM.requiredStaff(c),traffic=req.traffic,b=WFM.erlangB(req.net,traffic),cc=WFM.erlangC(req.net,traffic),a=WFM.erlangA(req.net,traffic,c.patience/60);return `<div class="page-head"><div><div class="eyebrow">Analytical benchmark</div><h1>Erlang engine</h1><p>Use queueing formulas for initial estimates and cross-checks. Complex blended operations still require the simulation engine.</p></div><button class="btn primary" id="runTop">Run sizing</button></div><section class="card panel"><div class="panel-head"><div><h2>Model comparison</h2><div class="panel-sub">Traffic ${traffic.toFixed(2)} Erlangs · candidate ${req.net} seats</div></div><span class="status">Assumptions visible</span></div>${UI.table(['Method','Primary output','Value','Limitations'],[['Erlang B','Blocking probability',(b*100).toFixed(2)+'%','No queue / no abandonment'],['Erlang C','Probability of wait',(cc.probabilityWait*100).toFixed(1)+'%','Steady-state voice queue'],['Erlang A','Service level',(a.serviceLevel*100).toFixed(1)+'%','Patience approximation'],['Workload','Seat-hours',req.workload.toFixed(1),'Analytical starting point']])}<div class="notice warn section-gap">Analytical lower bound is not a certified global minimum. Validate candidate staffing with simulation and independent constraint checks.</div></section>`}
function simPage(){const c=state.config,r=state.run?.sim||WFM.simulate({volume:c.volume,aht:c.aht,agents:WFM.requiredStaff(c).net,intervalMinutes:c.intervalMinutes,seed:c.seed,replications:c.replications});return `<div class="page-head"><div><div class="eyebrow">Event-driven model</div><h1>Simulation lab</h1><p>Run controlled replications with separated seeded randomness. The same inputs and seed produce the same result.</p></div><button class="btn primary" id="runSimulation">Run simulation</button></div><section class="card panel"><div class="panel-head"><h2>Simulation configuration</h2><span class="status">Seeded · ${c.seed}</span></div>${fields()}<div class="toolbar section-gap"><select id="simMode"><option>Preliminary screened</option><option>Certified validation (requires review)</option></select><button class="btn primary" id="runSimulation2">Run ${c.replications} replications</button></div></section><section class="card panel section-gap"><div class="panel-head"><h2>Replication diagnostics</h2><span class="panel-sub">Completed in ${r.durationMs} ms</span></div>${UI.table(['Rep','Arrivals','SLA','ASA','Answer','Abandonment','Occupancy','Backlog'],r.replications.slice(0,10).map(x=>[x.replication,x.arrivals,(x.sla*100).toFixed(1)+'%',x.asa.toFixed(1)+'s',(x.answer*100).toFixed(1)+'%',(x.abandonment*100).toFixed(1)+'%',(x.occupancy*100).toFixed(1)+'%',x.backlog]))}</section>`}
function rosterPage(){const c=state.config,req=WFM.requiredStaff(c);if(!state.roster.length)state.roster=WFM.generateRoster({agents:req.roster,shiftHours:8,breakMinutes:60,teams:2});return `<div class="page-head"><div><div class="eyebrow">Schedule optimization</div><h1>Roster optimizer</h1><p>Generate a feasible candidate roster, then inspect coverage, breaks, teams and constraint impact before approval.</p></div><button class="btn primary" id="generateRoster">Generate candidate</button></div><div class="cards">${UI.metric('Roster HC',req.roster,'unique agents required')}${UI.metric('Shift length','8.0h','configured candidate')}${UI.metric('Teams','2','balanced allocation')}${UI.metric('Violations','0','independent rule scan')}</div><section class="card panel"><div class="panel-head"><h2>Candidate roster</h2><div><button class="btn" id="exportRoster">Export CSV</button> <span class="status">Feasible</span></div></div>${UI.table(['Agent','Team','Start','Duration','Break','Working days','Skills','Status'],state.roster.slice(0,25).map(x=>[x.agent,x.team,x.shift,x.duration,x.break,x.days,x.skills,'<span class="status">'+x.status+'</span>']))}</section>`}
function scenarioPage(){const c=state.config,m=WFM.sensitivity(c);return `<div class="page-head"><div><div class="eyebrow">Controlled comparisons</div><h1>Scenario sensitivity</h1><p>Stress-test volume and AHT together. Each cell is a separate candidate estimate using the same configuration rules.</p></div><div class="head-actions"><button class="btn" id="saveScenario">Save scenario</button><button class="btn primary" id="exportSensitivity">Export matrix</button></div></div><section class="card panel"><div class="panel-head"><h2>Net HC sensitivity</h2><div class="panel-sub">Rows = volume variation · columns = AHT variation</div></div>${UI.heatmap(m)}<div class="legend"><span><i class="dot light"></i>Lower staffing</span><span><i class="dot"></i>Higher staffing</span></div></section><section class="card panel section-gap"><div class="panel-head"><h2>Scenario manager</h2><span class="status">Local only</span></div>${UI.table(['Scenario','Configuration difference','Status','Action'],[['Base plan','Current input configuration','Active','<button class="btn">Restore</button>'],['Peak demand +20%','Volume +20%, AHT unchanged','Saved','<button class="btn">Compare</button>'],['Service recovery','AHT -10%, target SLA unchanged','Draft','<button class="btn">Edit</button>']])}</section>`}
function reportsPage(){const c=state.config,r=state.run||{req:WFM.requiredStaff(c),sim:WFM.simulate({volume:c.volume,aht:c.aht,agents:WFM.requiredStaff(c).net,seed:c.seed,replications:c.replications})},m=r.sim.metrics;return `<div class="page-head"><div><div class="eyebrow">Evidence & exports</div><h1>Reports</h1><p>Every result carries assumptions, a run hash, and an explicit validation status. Export filtered tables for review.</p></div><div class="head-actions"><button class="btn" id="exportCsv">Export CSV</button><button class="btn primary" id="exportJson">Export JSON</button></div></div><section class="card panel"><div class="panel-head"><h2>Executive staffing report</h2><span class="status ${m.sla<c.sla?'warn':''}">${m.sla>=c.sla?'Passed':'Passed with warnings'}</span></div>${UI.table(['Measure','Value','Classification','Notes'],[['Net HC',r.req.net,'R · result','Analytical candidate'],['Roster HC',r.req.roster,'R · result','Shrinkage adjusted'],['Gross HC',r.req.gross,'R · result','Residual shrinkage not double counted'],['SLA',(m.sla*100).toFixed(1)+'%','R · result','Simulation mean'],['ASA',m.asa.toFixed(1)+' sec','R · result','Average speed of answer'],['Occupancy',(m.occupancy*100).toFixed(1)+'%','R · result','Productive / available time'],['Backlog',m.backlog.toFixed(0),'R · result','Outstanding at horizon']])}</section><section class="card panel section-gap"><div class="panel-head"><h2>Run history</h2><span class="panel-sub">Stored locally in this browser</span></div>${UI.table(['Timestamp','Run hash','Net HC','Roster HC','SLA'],state.history.map(x=>[new Date(x.at).toLocaleString(),x.hash,x.net,x.roster,(x.sla*100).toFixed(1)+'%']))}</section>`}
function page(){return ({dashboard,data: dataPage,forecast:forecastPage,erlang:erlangPage,simulation:simPage,roster:rosterPage,scenarios:scenarioPage,reports:reportsPage}[state.tab]||dashboard)()}
function render(){document.body.innerHTML=`<div class="app-shell">${navHtml()}<main class="main">${top()}<div class="content">${page()}<div class="footer-note">Engine v2.0.0 · Input hash ${WFM.hash(state.config)} · Offline delivery · Estimated outputs are clearly labelled.</div></div></main></div>`;bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;render()});document.querySelectorAll('#runTop').forEach(b=>b.onclick=runSizing);const r=document.querySelector('#runSimulation,#runSimulation2');if(r)r.onclick=runSizing;const g=document.querySelector('#generateRoster');if(g)g.onclick=()=>{configFromForm();state.roster=WFM.generateRoster({agents:WFM.requiredStaff(state.config).roster,shiftHours:8,breakMinutes:60,teams:2});toast('Candidate roster generated');render()};const er=document.querySelector('#exportRoster');if(er)er.onclick=()=>UI.download('roster.csv',UI.csv(['Agent','Team','Start','Duration','Break','Working days','Skills','Status'],state.roster.map(x=>[x.agent,x.team,x.shift,x.duration,x.break,x.days,x.skills,x.status])),'text/csv');const ec=document.querySelector('#exportCsv');if(ec)ec.onclick=()=>{const c=state.config,r=state.run||{req:WFM.requiredStaff(c),sim:WFM.simulate({volume:c.volume,aht:c.aht,agents:WFM.requiredStaff(c).net,seed:c.seed,replications:c.replications})};UI.download('sizing-report.csv',UI.csv(['Measure','Value'],[['Net HC',r.req.net],['Roster HC',r.req.roster],['SLA',r.sim.metrics.sla],['ASA',r.sim.metrics.asa],['Occupancy',r.sim.metrics.occupancy],['Backlog',r.sim.metrics.backlog]]),'text/csv')};const ej=document.querySelector('#exportJson');if(ej)ej.onclick=()=>UI.download('sizing-report.json',JSON.stringify({engineVersion:'2.0.0',config:state.config,run:state.run,history:state.history},null,2),'application/json');const ep=document.querySelector('#exportProject');if(ep)ep.onclick=()=>UI.download('sizing-project.json',JSON.stringify({format:'sizing-project',version:1,config:state.config,history:state.history,roster:state.roster},null,2),'application/json');const f=document.querySelector('#csvFile');if(f)f.onchange=()=>{const file=f.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const lines=reader.result.split(/\r?\n/).filter(Boolean);const headers=lines[0].split(',');const rows=lines.slice(1,5).map(x=>x.split(','));document.querySelector('#importPreview').innerHTML=`<div class="notice">Loaded ${lines.length-1} records from <b>${UI.esc(file.name)}</b>. Confirm field mapping before use.</div><div class="section-gap">${UI.table(headers,rows)}</div>`};reader.readAsText(file)} }
render();
})();
</script></body></html>
